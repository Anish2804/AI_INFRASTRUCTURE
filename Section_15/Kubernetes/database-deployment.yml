apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16

          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgre-vol

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: password

            - name: POSTGRES_DB
              value: emaildb

      volumes:
        - name: postgre-vol
          persistentVolumeClaim:
            claimName: host-pvc