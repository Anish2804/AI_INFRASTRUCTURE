apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-fastapi-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fastapi-app

  template:
    metadata:
      labels:
        app: fastapi-app

    spec:
      containers:
        - name: fastapi-app
          image: anishsdocker/email-app:latest

          ports:
            - containerPort: 8000